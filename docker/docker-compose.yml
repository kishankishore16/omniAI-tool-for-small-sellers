# ══════════════════════════════════════════════════════════════
# OmniAI — Docker Compose
# Runs both FastAPI backend and Streamlit frontend
# ══════════════════════════════════════════════════════════════

services:
  # ── FastAPI Backend ──────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: omniai-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=${DEBUG:-false}
    volumes:
      - omniai-data:/app/data
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Streamlit Frontend ──────────────────────────────────────
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: omniai-ui
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      - API_BASE_URL=http://api:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - omniai-data:/app/data
    command: >
      streamlit run ui/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  omniai-data:
    driver: local
